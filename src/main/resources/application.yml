spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    database: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  sentry:
    dsn: ${SENTRY_DSN}
    send-default-pii: true

file:
  upload-dir: ${IMG_UPLOAD_DIR}

manager:
  initial:
    username: ${MANAGER_USERNAME}
    password: ${MANAGER_PASSWORD}
    enabled: true