name: Build and Deploy via HTTPS
on:
  push:
    branches: [ "develop" ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test -x sentryBundleSourcesJava
      - name: Upload JAR via HTTPS
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          curl -X POST \
            -H "X-API-KEY: ${{ secrets.DEPLOY_API_KEY }}" \
            -F "file=@${JAR_FILE}" \
            https://jid.ncloud.sbs/deployment/new/upload
